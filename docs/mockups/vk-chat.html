<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VKinder — макет диалога</title>
<style>
  :root{
    --bg:#141416;
    --sidebar:#1b1b1e;
    --header:#19191c;
    --line:#2b2b2f;
    --text:#e8e9eb;
    --muted:#8b8d94;
    --muted-2:#6f7178;
    --in:#27272b;
    --out:#3b6ce2;
    --accent:#5b8cff;
    --green:#3ecf6a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    width:1440px;height:900px;overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Inter",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;
  }
  svg{display:block}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:304px;flex:0 0 304px;background:var(--sidebar);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
  }
  .side-head{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px}
  .side-title{font-size:16px;font-weight:600;letter-spacing:.1px;flex:1}
  .brand{
    width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,#4d7dff,#ff5f9e);box-shadow:0 6px 18px rgba(77,125,255,.35);
  }
  .brand svg{width:18px;height:18px;fill:#fff}
  .icon-btn{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);
  }
  .icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .search{
    margin:2px 14px 10px;height:36px;border-radius:10px;background:#242427;
    display:flex;align-items:center;gap:9px;padding:0 11px;color:var(--muted);font-size:14px;
  }
  .search svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

  .chats{flex:1;overflow:hidden;padding:2px 8px}
  .chat-item{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:10px}
  .chat-item.active{background:#29292e}
  .ava{
    width:46px;height:46px;border-radius:50%;flex:0 0 46px;display:grid;place-items:center;
    font-size:17px;font-weight:600;color:#fff;position:relative;
  }
  .ava.small{width:32px;height:32px;flex:0 0 32px}
  .ava-bot{background:linear-gradient(135deg,#4d7dff,#ff5f9e)}
  .ava-bot svg{width:22px;height:22px;fill:#fff}
  .ava.small svg{width:16px;height:16px}
  .a1{background:linear-gradient(135deg,#f3a35c,#e0663f)}
  .a2{background:linear-gradient(135deg,#5ac8b0,#2f8f7c)}
  .a3{background:linear-gradient(135deg,#9a8cf0,#6252c9)}
  .a4{background:linear-gradient(135deg,#7f8ea3,#4d5a6b)}
  .a5{background:linear-gradient(135deg,#e08a9e,#b25670)}
  .ci{flex:1;min-width:0}
  .ci-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ci-name{font-size:14.5px;font-weight:600}
  .ci-time{font-size:11.5px;color:var(--muted-2);flex:0 0 auto}
  .ci-prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .badge{
    min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;
    font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;
  }
  .ci-line{display:flex;align-items:center;gap:8px;margin-top:2px}
  .ci-line .ci-prev{margin:0;flex:1}

  /* ---------- chat ---------- */
  .chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--header)}
  .chat-head{
    height:64px;flex:0 0 64px;display:flex;align-items:center;gap:12px;
    padding:0 22px;border-bottom:1px solid var(--line);background:var(--header);
  }
  .ch-title{flex:1;min-width:0}
  .ch-name{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .verified{
    width:15px;height:15px;border-radius:50%;background:var(--out);display:grid;place-items:center;
  }
  .verified svg{width:8px;height:8px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .ch-sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(62,207,106,.14)}
  .ch-actions{display:flex;gap:4px;color:var(--muted)}

  .messages{
    flex:1;overflow:hidden;padding:18px 30px 10px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:9px;
  }
  .divider{display:flex;justify-content:center;margin:2px 0 8px}
  .divider span{
    font-size:12px;color:var(--muted);background:#212125;border-radius:20px;padding:4px 12px;
  }
  .row{display:flex;gap:9px;align-items:flex-end;max-width:100%}
  .row.me{justify-content:flex-end}
  .row.bot .ava{align-self:flex-end;margin-bottom:1px}
  .msg{max-width:560px}
  .author{font-size:12.5px;font-weight:600;color:var(--accent);margin:0 0 4px 2px}
  .bubble{
    position:relative;background:var(--in);border-radius:13px;padding:9px 14px 8px;
    font-size:15px;line-height:1.42;white-space:pre-line;word-break:break-word;
    border-bottom-left-radius:5px;
  }
  .row.me .bubble{
    background:var(--out);border-bottom-left-radius:13px;border-bottom-right-radius:5px;
    white-space:normal;
  }
  .bubble a{color:#9dbcff;text-decoration:none}
  .row.me .bubble a{color:#fff}
  .time{
    display:block;text-align:right;font-size:10.5px;color:rgba(255,255,255,.42);
    margin-top:3px;letter-spacing:.2px;
  }
  .row.bot .time{color:var(--muted-2)}

  /* profile card */
  .bubble.profile{padding:10px;border-bottom-left-radius:5px}
  .ptext{font-size:14.5px;line-height:1.5;padding:2px 4px 0}
  .ptext b{font-weight:600}
  .photos{
    display:grid;grid-template-columns:1.95fr 1fr;grid-template-rows:1fr 1fr;gap:3px;
    width:506px;height:250px;margin-top:9px;border-radius:11px;overflow:hidden;
  }
  .ph{position:relative;overflow:hidden;background:#3a3a42}
  .ph-1{grid-row:1 / 3}
  .ph-2{background-image:
    radial-gradient(120% 90% at 22% 12%,rgba(255,255,255,.34),transparent 55%),
    radial-gradient(120% 110% at 82% 92%,rgba(255,86,140,.85),transparent 62%),
    linear-gradient(150deg,#6c4bd8,#2b1e63)}
  .ph-3{background-image:
    radial-gradient(120% 90% at 20% 8%,rgba(255,255,255,.3),transparent 55%),
    radial-gradient(120% 110% at 80% 95%,rgba(255,180,90,.75),transparent 60%),
    linear-gradient(160deg,#2f8f9e,#123c4a)}
  .ph-1{background-image:
    radial-gradient(100% 80% at 25% 10%,rgba(255,255,255,.28),transparent 55%),
    radial-gradient(90% 90% at 78% 88%,rgba(255,95,158,.9),transparent 58%),
    linear-gradient(140deg,#4d7dff,#3a1f6e 70%,#25123f)}
  .ph::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.42));
  }
  .ph svg{
    position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);
    width:46%;fill:rgba(255,255,255,.22);filter:blur(.3px);z-index:1;
  }
  .ph-2 svg{width:64%;left:58%}
  .ph-3 svg{width:56%;left:44%}

  .composer{
    flex:0 0 74px;display:flex;align-items:center;gap:10px;padding:0 22px;
    border-top:1px solid var(--line);background:var(--header);
  }
  .composer .plus{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    color:var(--muted);font-size:22px;font-weight:300;line-height:1;
  }
  .composer .field{
    flex:1;height:42px;border-radius:12px;background:#242428;display:flex;align-items:center;
    padding:0 14px;color:var(--muted-2);font-size:14.5px;gap:10px;
  }
  .composer .field span{flex:1}
  .composer .field svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .composer .send{
    width:38px;height:38px;border-radius:50%;background:var(--out);display:grid;place-items:center;
  }
  .composer .send svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- mobile ---------- */
  body.mobile{
    width:480px;height:960px;display:grid;place-items:center;
    background:
      radial-gradient(70% 55% at 20% 10%,rgba(77,125,255,.18),transparent 60%),
      radial-gradient(60% 50% at 85% 90%,rgba(255,95,158,.13),transparent 60%),
      #0d0e12;
  }
  body.mobile .phone{
    width:406px;height:884px;border-radius:56px;padding:11px;background:#0a0a0c;
    box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px #26262c inset;
  }
  body.mobile .screen{
    width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);
    position:relative;display:flex;flex-direction:column;
  }
  body.mobile .screen::before{
    content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:104px;height:26px;border-radius:14px;background:#0a0a0c;z-index:5;
  }
  body.mobile .sidebar{display:none}
  body.mobile .chat{height:auto;flex:1;min-height:0}
  body.mobile .statusbar{
    height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;font-size:12px;font-weight:600;color:#d6d9e2;position:relative;z-index:4;
  }
  body.mobile .statusbar svg{width:46px;height:11px;fill:#d6d9e2;opacity:.9}
  body.mobile .chat-head{height:60px;flex-basis:60px;padding:0 16px}
  body.mobile .chat-head .ava.small{width:34px;height:34px;flex-basis:34px}
  body.mobile .messages{padding:14px 14px 8px;gap:8px}
  body.mobile .msg{max-width:300px}
  body.mobile .bubble{font-size:14.5px;padding:8px 12px 7px}
  body.mobile .bubble.profile{padding:8px}
  body.mobile .author{font-size:12px}
  body.mobile .photos{width:264px;height:170px}
  body.mobile .composer{flex-basis:66px;padding:0 12px;gap:6px}
  body.mobile .composer .field{height:38px;font-size:13.5px}
  body.mobile .composer .send{width:34px;height:34px}
  body.mobile .ph svg{width:54%}
  body.mobile .ph-2 svg{width:70%}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="side-head">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 20.6l-1.1-1C6.1 15.4 3 12.6 3 9.2 3 6.5 5.1 4.5 7.7 4.5c1.6 0 3.1.8 4.3 2.1 1.2-1.3 2.7-2.1 4.3-2.1 2.6 0 4.7 2 4.7 4.7 0 3.4-3.1 6.2-7.9 10.4l-1.1 1z"/></svg>
    </div>
    <div class="side-title">Мессенджер</div>
    <div class="icon-btn">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
    </div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span>Поиск</span>
  </div>

  <div class="chats">
    <div class="chat-item active">
      <div class="ava ava-bot">
        <svg viewBox="0 0 24 24"><path d="M12 20.6l-1.1-1C6.1 15.4 3 12.6 3 9.2 3 6.5 5.1 4.5 7.7 4.5c1.6 0 3.1.8 4.3 2.1 1.2-1.3 2.7-2.1 4.3-2.1 2.6 0 4.7 2 4.7 4.7 0 3.4-3.1 6.2-7.9 10.4l-1.1 1z"/></svg>
      </div>
      <div class="ci">
        <div class="ci-top"><span class="ci-name">VKinder</span><span class="ci-time">21:15</span></div>
        <div class="ci-line"><span class="ci-prev">Анна, 27 · vk.com/id1234567</span></div>
      </div>
    </div>

    <div class="chat-item">
      <div class="ava a1">М</div>
      <div class="ci">
        <div class="ci-top"><span class="ci-name">Мама</span><span class="ci-time">20:02</span></div>
        <div class="ci-prev">Позвони, как освободишься</div>
      </div>
    </div>

    <div class="chat-item">
      <div class="ava a2">ДР</div>
      <div class="ci">
        <div class="ci-top"><span class="ci-name">Дизайн-ревью</span><span class="ci-time">18:40</span></div>
        <div class="ci-line"><span class="ci-prev">Скинул правки в Figma</span><span class="badge">2</span></div>
      </div>
    </div>

    <div class="chat-item">
      <div class="ava a3">А</div>
      <div class="ci">
        <div class="ci-top"><span class="ci-name">Аня</span><span class="ci-time">17:12</span></div>
        <div class="ci-prev">Спасибо! 🙌</div>
      </div>
    </div>

    <div class="chat-item">
      <div class="ava a4">Р</div>
      <div class="ci">
        <div class="ci-top"><span class="ci-name">Работа</span><span class="ci-time">Вчера</span></div>
        <div class="ci-prev">Созвон в 10:00</div>
      </div>
    </div>

    <div class="chat-item">
      <div class="ava a5">Д</div>
      <div class="ci">
        <div class="ci-top"><span class="ci-name">Доставка</span><span class="ci-time">Пн</span></div>
        <div class="ci-prev">Заказ доставлен</div>
      </div>
    </div>
  </div>
</aside>

<main class="chat">
  <header class="chat-head">
    <div class="ava ava-bot small">
      <svg viewBox="0 0 24 24"><path d="M12 20.6l-1.1-1C6.1 15.4 3 12.6 3 9.2 3 6.5 5.1 4.5 7.7 4.5c1.6 0 3.1.8 4.3 2.1 1.2-1.3 2.7-2.1 4.3-2.1 2.6 0 4.7 2 4.7 4.7 0 3.4-3.1 6.2-7.9 10.4l-1.1 1z"/></svg>
    </div>
    <div class="ch-title">
      <div class="ch-name">VKinder
        <span class="verified"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      </div>
      <div class="ch-sub"><span class="dot"></span> бот сообщества</div>
    </div>
    <div class="ch-actions">
      <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 3h3l2 5-2.5 1.5a12 12 0 005 5L15 12l5 2v3a2 2 0 01-2.2 2A17 17 0 014 5.2 2 2 0 016 3z"/></svg></div>
      <div class="icon-btn"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2.5"/><path d="M15 10.5l5-3v9l-5-3z"/></svg></div>
      <div class="icon-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
    </div>
  </header>

  <section class="messages" id="messages"></section>

  <footer class="composer">
    <div class="plus">+</div>
    <div class="field">
      <span>Написать сообщение…</span>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.2s1.2 2 3.5 2 3.5-2 3.5-2"/><circle cx="9" cy="9.6" r=".8" fill="currentColor" stroke="none"/><circle cx="15" cy="9.6" r=".8" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="send">
      <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.6-6.4L4 12z"/></svg>
    </div>
  </footer>
</main>

<script>
  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.6l-1.1-1C6.1 15.4 3 12.6 3 9.2 3 6.5 5.1 4.5 7.7 4.5c1.6 0 3.1.8 4.3 2.1 1.2-1.3 2.7-2.1 4.3-2.1 2.6 0 4.7 2 4.7 4.7 0 3.4-3.1 6.2-7.9 10.4l-1.1 1z"/></svg>';
  const SIL = '<svg viewBox="0 0 100 140"><g fill="#fff" opacity=".22"><circle cx="50" cy="34" r="19"/><rect x="42" y="44" width="16" height="52" rx="8"/><path d="M2 140c0-38 21-68 48-68s48 30 48 68z"/></g></svg>';

  const photos = `
    <div class="photos">
      <div class="ph ph-1">${SIL}</div>
      <div class="ph ph-2">${SIL}</div>
      <div class="ph ph-3">${SIL}</div>
    </div>`;

  const dialog = [
    {divider:'Сегодня'},
    {from:'me', time:'21:14', html:'Привет'},
    {from:'bot', time:'21:14', html:'Привет дружище, Алексей!'},
    {from:'me', time:'21:15', html:'Поиск'},
    {from:'bot', time:'21:15', html:'Пошел искать...'},
    {from:'bot', time:'21:15', cls:'profile',
      html:`<div class="ptext">Имя: Анна<br>Ссылка на страницу: <a>https://vk.com/id1234567</a></div>${photos}`}
  ];

  const commands = [
    {divider:'Сегодня'},
    {from:'me', time:'21:19', html:'Привет'},
    {from:'bot', time:'21:19', html:'Привет дружище, Алексей!'},
    {from:'me', time:'21:20', html:'Помоги'},
    {from:'bot', time:'21:20',
      html:'Извини друг, не знаю такой команды(((\nСписок доступных команд:\n\\привет\n\\поиск\n\\пока'}
  ];

  const state = new URLSearchParams(location.search).get('state') || 'dialog';
  const data = state === 'commands' ? commands : dialog;
  const root = document.getElementById('messages');

  data.forEach(m => {
    if (m.divider) {
      root.insertAdjacentHTML('beforeend', `<div class="divider"><span>${m.divider}</span></div>`);
      return;
    }
    if (m.from === 'me') {
      root.insertAdjacentHTML('beforeend',
        `<div class="row me"><div class="bubble">${m.html}<span class="time">${m.time}</span></div></div>`);
    } else {
      root.insertAdjacentHTML('beforeend',
        `<div class="row bot"><div class="ava ava-bot small">${HEART}</div>
          <div class="msg"><div class="author">VKinder</div>
          <div class="bubble ${m.cls || ''}">${m.html}<span class="time">${m.time}</span></div></div></div>`);
    }
  });

  if (new URLSearchParams(location.search).get('mobile') === '1') {
    document.body.classList.add('mobile');
    const phone = document.createElement('div');
    phone.className = 'phone';
    const screen = document.createElement('div');
    screen.className = 'screen';
    while (document.body.firstChild) screen.appendChild(document.body.firstChild);
    const status = document.createElement('div');
    status.className = 'statusbar';
    status.innerHTML = '<span>21:15</span><svg viewBox="0 0 50 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M26 3.2c3.6-2.6 8.4-2.6 12 0l-1.3 1.7c-2.8-2-6.6-2-9.4 0zM28.3 6.2c2.2-1.6 5.1-1.6 7.3 0l-1.4 1.8c-1.3-1-3.1-1-4.5 0zM31 9.3l2 2.5 2-2.5c-1.2-.9-2.8-.9-4 0z"/><rect x="38" y="2" width="8" height="9" rx="2" fill="none" stroke="#d6d9e2" stroke-width="1"/><rect x="39.4" y="3.4" width="4.6" height="6.2" rx="1"/><rect x="46" y="4.6" width="1.4" height="3.8" rx=".7"/></svg>';
    screen.insertBefore(status, screen.firstChild);
    phone.appendChild(screen);
    document.body.appendChild(phone);
  }
</script>
</body>
</html>
